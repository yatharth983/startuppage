<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Home</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
    }
    img {
      width: 100%;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Replace 'background-mobile.jpg' with your exact image file name or link -->
  <img src="face.png" alt="Wallpaper">
</body>
</html>
